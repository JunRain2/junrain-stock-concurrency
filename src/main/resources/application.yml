spring:
  application:
    name: stock-concurrency

  threads:
    virtual:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/foo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: "localhost"
      port: 6379
      batch-size: 500

stock:
  reserve:
    # 점유 시간. 만료 인덱스의 score가 되고, 이 시각이 지나면 스케줄러가 조건 없이 재고를 되돌린다.
    # 요청 하나가 이 시간 안에 끝나지 못하면 응답 중인 예약을 회수해 버리므로, 요청 타임아웃보다 충분히 길어야 한다
    hold-minutes: 10

  reclaim:
    # 만료 회수 주기. 이 값만큼이 회수 지연의 상한에 더해진다
    delay-seconds: 10
    # 한 주기에 되돌릴 예약 수. 밀린 만큼은 다음 주기가 이어받는다
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

bulk-insert:
  max-size: 5000
  chunk-size: 1000
  retry-milliseconds: 2000,5000
