spring:
  application:
    name: stock-concurrency

  threads:
    virtual:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/foo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: "localhost"
      port: 6379
      batch-size: 500

# 재고 차감 전략. redis | skip-locked | single-update
# 구현체 등록과 초기 재고를 심을 저장소가 이 값 하나로 같이 움직인다.
# 부하테스트는 STOCK_STRATEGY 환경변수로 덮어써 같은 이미지로 세 전략을 다 돈다.
stock:
  strategy: redis
  reserve:
    # 점유 트랜잭션의 상한. 차감이 커밋보다 먼저 일어나므로 이 값이 곧
    # "차감은 됐는데 예약은 아직 안 보이는" 창의 길이다. reconcile.grace-seconds가 이 값보다 커야 한다
    timeout-seconds: 10
  reconcile:
    # 타임아웃·롤백으로 표시된 상품만 회수한다. 표시가 없으면 쿼리 한 줄도 나가지 않는다
    suspect-delay-seconds: 60
    # 전수 스캔. 표시를 남기지 못한 누수(프로세스 크래시)만 남으므로 드물게 돈다
    cron: "0 0 4 * * SUN"
    # Redis 스냅샷 뒤 예약 합계를 읽기까지의 유예.
    # 최대 트랜잭션 수행 시간보다 커야 한다 - 짧으면 진행 중인 점유를 누수로 오인해 오버셀이 난다
    grace-seconds: 60
    chunk-size: 1000

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

bulk-insert:
  max-size: 5000
  chunk-size: 1000
  retry-milliseconds: 2000,5000
