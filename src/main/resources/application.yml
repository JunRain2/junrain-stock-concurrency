spring:
  application:
    name: stock-concurrency

  threads:
    virtual:
      enabled: true

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.MySQLDialect
      format_sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/foo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: "localhost"
      port: 6379
      batch-size: 500

  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz:
        scheduler:
          instanceName: quartzScheduler
          instanceId: AUTO
        jobStore:
          driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
          tablePrefix: foo.QRTZ_
          isClustered: true
        threadPool:
          threadCount: 10

# 재고 차감 전략. redis | skip-locked | single-update
# 구현체 등록과 초기 재고를 심을 저장소가 이 값 하나로 같이 움직인다.
# 부하테스트는 STOCK_STRATEGY 환경변수로 덮어써 같은 이미지로 세 전략을 다 돈다.
stock:
  strategy: redis

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

bulk-insert:
  max-size: 5000
  chunk-size: 1000
  retry-milliseconds: 2000,5000
