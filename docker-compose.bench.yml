# 부하테스트용 오버레이. 앱까지 컨테이너에 넣고 자원 상한을 건다.
#
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml up -d --build
#
# 또는 한 번 걸어두고 쓰기:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.bench.yml
#
# 사전 조건: Docker Desktop > Settings > Resources 를 CPU 6 / Memory 8GB 이상으로.
#   VM 6 (MySQL 2 + 앱 2 + Redis 1 + 여유 1) + 호스트 2 (k6, macOS) = 8코어
#
# 목적은 운영 하드웨어 재현이 아니라 실행 사이 조건을 같게 만드는 것이다.
# 여기 값을 바꾸면 이전 측정과 비교할 수 없다 - 바꿨으면 baseline을 다시 잰다.
# 근거: docs/usecase/재고점유/02-부하테스트-모델.md

services:
  app:
    build: .
    container_name: stock-concurrency-app
    # JDK 21은 컨테이너 인식이 기본이라 availableProcessors()가 이 값을 반환한다.
    # Virtual Thread 캐리어 풀이 여기 맞춰 자동으로 잡히므로 ActiveProcessorCount가 필요 없다.
    cpus: 2.0
    mem_limit: 1500m
    environment:
      # 컨테이너 안에서는 localhost가 아니라 서비스 이름으로 붙는다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/foo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATA_REDIS_HOST: redis
      SPRING_JPA_SHOW_SQL: "false"
      # 어느 재고 전략을 잴지. 이 값만 바꾸면 같은 이미지로 세 전략을 다 돈다(리빌드 불필요).
      # redis | skip-locked | single-update. reset.sh에도 같은 값을 준다.
      STOCK_STRATEGY: "redis"
      # Quartz는 클러스터 모드라 7.5초마다 QRTZ_LOCKS를 잠그고, 등록된 잡은 5분마다 돈다.
      # 둘 다 측정과 같은 커넥션 풀을 쓴다 - 1회 실행이 4~5분이라 잡이 측정 구간 안으로 들어간다.
      SPRING_QUARTZ_AUTO_STARTUP: "false"
      # MaxRAMPercentage는 mem_limit 기준. 시작=최대로 묶어 측정 중 힙 리사이즈를 막는다.
      # AlwaysPreTouch는 힙 페이지를 기동 때 미리 만져 측정 중 페이지 폴트를 없앤다.
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=70
        -XX:MaxRAMPercentage=70
        -XX:+AlwaysPreTouch
        -XX:+UseG1GC
      TZ: Asia/Seoul
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s

  mysql:
    cpus: 2.0
    mem_limit: 2g
    # command는 병합이 아니라 교체다. 베이스의 charset 설정을 여기 다시 적는다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 데이터가 작아 워밍업 후 전부 메모리에 올라간다. 실행마다 같은 값이어야 한다.
      - --innodb-buffer-pool-size=1G
      # 1 = 커밋마다 fsync(운영 기본값), 2 = OS 버퍼까지만.
      # Docker Desktop VM에서 fsync 지연이 ms 단위로 튀므로, 첫 측정 때 양쪽을 재고
      # 격차가 크면 지금 재고 있는 것이 경합이 아니라 디스크라는 뜻이다.
      - --innodb-flush-log-at-trx-commit=1
      # 기본값 50초. 직렬화된 행에 고부하를 부으면 대기 큐가 수십 초로 늘어 p95를
      # 읽을 수 없다. 빨리 실패해야 포화가 보인다.
      - --innodb-lock-wait-timeout=2
      # 커넥션 풀보다 넉넉해야 연결 거부가 먼저 나지 않는다.
      - --max-connections=200

  redis:
    # STOCK_STRATEGY가 redis가 아니어도 띄운다 -
    # 어느 날 컨테이너가 하나 늘거나 줄면 그 차이가 결과에 섞인다.
    cpus: 1.0
    mem_limit: 512m
